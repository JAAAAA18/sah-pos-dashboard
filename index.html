<!DOCTYPE html>
<html>
<head>
  <title>SAH POS Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    body { margin:0; font-family:Arial; background:#f3f4f6; }

    .header {
      position:sticky;
      top:0;
      background:#16a34a;
      color:white;
      padding:14px 18px;
      font-weight:bold;
      display:flex;
      align-items:center;
      gap:12px;
    }

    .hamburger { cursor:pointer; }

    .drawer {
      position:fixed;
      top:0;
      left:-280px;
      width:280px;
      height:100%;
      background:white;
      transition:0.3s;
      z-index:1000;
      overflow:auto;
    }
    .drawer.open { left:0; }

    .overlay {
      position:fixed;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.3);
      display:none;
    }
    .overlay.show { display:block; }

    .menu-item {
      padding:12px 16px;
      cursor:pointer;
      border-bottom:1px solid #f1f1f1;
      font-size:14px;
    }

    .container { padding:18px; }

    .range-bar {
      display:flex;
      justify-content:center;
      gap:12px;
      background:white;
      padding:12px;
      border-radius:10px;
      margin-bottom:14px;
    }

    .cards {
      display:flex;
      gap:12px;
      overflow-x:auto;
    }
    .cards::-webkit-scrollbar { display:none; }

    .card {
      min-width:140px;
      background:white;
      padding:14px;
      border-radius:12px;
      flex-shrink:0;
    }

    .panel { background:white; padding:14px; border-radius:12px; }

    #categoryView { display:none; padding:18px; }

  </style>
</head>

<body>

<!-- DRAWER -->
<div class="drawer" id="drawer">
  <div style="padding:16px; border-bottom:1px solid #eee;">
    <div style="font-weight:bold;">Owner</div>
    <div id="userEmail" style="font-size:12px;">Loading...</div>
  </div>

  <div style="padding:10px 16px; font-weight:bold;">Reports</div>
  <div class="menu-item" onclick="backToDashboard()">Sales summary</div>
  <div class="menu-item" onclick="openCategory()">Sales by category</div>
</div>

<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>

<div class="header" id="headerTitle">
  <div class="hamburger" onclick="toggleDrawer()">☰</div>
  Sales summary
</div>

<!-- DASHBOARD -->
<div class="container">

  <div class="range-bar">
    <button onclick="move(-7)">◀</button>
    <div id="rangeText"></div>
    <button onclick="move(7)">▶</button>
  </div>

  <div class="cards">
    <div class="card"><div>Gross Sales</div><div id="gross">₱0</div></div>
    <div class="card"><div>Net Sales</div><div id="net">₱0</div></div>
    <div class="card"><div>Profit</div><div id="profit">₱0</div></div>
    <div class="card"><div>Refund</div><div id="refund">₱0</div></div>
  </div>

  <div class="panel">
    <canvas id="chart"></canvas>

    <div style="margin-top:20px;">
      <div style="font-weight:bold;">EXPORT</div>

      <div style="display:flex; justify-content:space-between; font-size:13px; color:#6b7280;">
        <div>Date</div>
        <div>Gross Sales</div>
      </div>

      <div id="tableRows"></div>
    </div>
  </div>

</div>

<!-- CATEGORY VIEW -->
<div id="categoryView">

  <div class="panel">
    <div style="font-weight:bold; margin-bottom:10px;">EXPORT</div>

    <div style="display:flex; justify-content:space-between; font-size:13px; color:#6b7280;">
      <div>Category</div>
      <div>Items Sold</div>
      <div>Net Sales</div>
    </div>

    <div id="categoryTable"></div>

  </div>

</div>

<script>

/* DRAWER */
function toggleDrawer(){
  drawer.classList.toggle("open");
  overlay.classList.toggle("show");
}

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAKP...",
  authDomain: "sah-bacoor-pos.firebaseapp.com",
  projectId: "sah-bacoor-pos"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* AUTH EMAIL */
firebase.auth().onAuthStateChanged(user=>{
  userEmail.innerText = user ? user.email : "Not logged in";
});

/* UID */
const uid = new URLSearchParams(location.search).get("uid");

let allData = [];
let chart;

let startDate = new Date();
let endDate = new Date();
startDate.setDate(endDate.getDate()-6);

function format(d){
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}

function updateRange(){
  rangeText.innerText = `${format(startDate)} → ${format(endDate)}`;
}

/* APPLY */
function apply(){

  updateRange();

  let s=new Date(startDate);
  let e=new Date(endDate);
  s.setHours(0,0,0,0);
  e.setHours(23,59,59,999);

  let filtered=allData.filter(d=>d.date>=s&&d.date<=e);

  let gross=0, profit=0, refund=0;

  filtered.forEach(d=>{
    gross+=d.total;
    profit+=d.profit||0;
    if(d.isRefund) refund+=Math.abs(d.total);
  });

  grossEl.innerText="₱"+gross.toFixed(2);
  net.innerText="₱"+gross.toFixed(2);
  profitEl.innerText="₱"+profit.toFixed(2);
  refundEl.innerText="₱"+refund.toFixed(2);

  updateChart(filtered);

  /* ✅ AUTO UPDATE CATEGORY (ADDED) */
  if(categoryView.style.display==="block"){
    renderCategory();
  }
}

/* CHART */
function updateChart(data){

  let map={};

  data.forEach(d=>{
    let key=d.date.toDateString();
    map[key]=(map[key]||0)+d.total;
  });

  let labels=[], values=[], exportData=[];

  let cur=new Date(startDate);
  while(cur<=endDate){
    let key=cur.toDateString();
    let val=map[key]||0;

    labels.push(format(cur));
    values.push(val);

    exportData.push({
      date: new Date(cur),
      sales: val
    });

    cur.setDate(cur.getDate()+1);
  }

  renderTable(exportData);

  if(chart) chart.destroy();

  chart=new Chart(chartCanvas,{
    type:"bar",
    data:{
      labels,
      datasets:[{
        label:"Gross Sales",
        data:values,
        backgroundColor:"#16a34a",
        barThickness:12
      }]
    }
  });
}

/* TABLE */
function renderTable(data){
  tableRows.innerHTML="";

  data.reverse().forEach(r=>{
    let div=document.createElement("div");

    div.style.display="flex";
    div.style.justifyContent="space-between";

    div.innerHTML=`
      <div>${r.date.toLocaleDateString()}</div>
      <div>₱${r.sales.toLocaleString()}</div>
    `;

    tableRows.appendChild(div);
  });
}

function renderCategory(){

  let s=new Date(startDate);
  let e=new Date(endDate);
  s.setHours(0,0,0,0);
  e.setHours(23,59,59,999);

  let filtered=allData.filter(d=>d.date>=s&&d.date<=e);

  let map={};

  filtered.forEach(d => {

    let items = d.items || [];

    items.forEach(item => {

      let cat = item.category || "Uncategorized";
      let qty = (item.qty || 1) * (item.pieces || 1);
      let total = item.price * (item.qty || 1);

      if (!map[cat]) map[cat] = { qty: 0, total: 0 };

      map[cat].qty += qty;
      map[cat].total += total;

    });

  });

  categoryTable.innerHTML="";

  Object.keys(map).forEach(cat=>{
    let row=map[cat];

    let div=document.createElement("div");
    div.style.display="flex";
    div.style.justifyContent="space-between";
    div.style.padding="10px 0";
    div.style.borderBottom="1px solid #eee";

    div.innerHTML=`
      <div>${cat}</div>
      <div>${row.qty}</div>
      <div>₱${row.total.toLocaleString()}</div>
    `;

    categoryTable.appendChild(div);
  });
}

/* NAVIGATION */
function openCategory(){
  document.querySelector(".container").style.display="none";
  categoryView.style.display="block";
  toggleDrawer();

  /* ✅ CHANGE TITLE (ADDED) */
  headerTitle.innerHTML = `
    <div class="hamburger" onclick="toggleDrawer()">☰</div>
    Sales by category
  `;

  renderCategory();
}

function backToDashboard(){
  document.querySelector(".container").style.display="block";
  categoryView.style.display="none";
  toggleDrawer();

  /* ✅ RESTORE TITLE (ADDED) */
  headerTitle.innerHTML = `
    <div class="hamburger" onclick="toggleDrawer()">☰</div>
    Sales summary
  `;
}

/* FIRESTORE */
if(uid){
  db.collection("users").doc(uid).collection("sales")
    .onSnapshot(snap=>{
      allData=[];

      snap.forEach(doc=>{
        let d=doc.data();
        if(!d.createdAt) return;

        allData.push({
          total:Number(d.total||0),
          profit:Number(d.profit||0),
          isRefund:d.isRefund||false,
          category:d.category,
          qty:d.qty,
          date:d.createdAt.toDate(),
          
          items: d.items || []
        });
      });

      apply();
    });
}

/* MOVE */
function move(days){
  startDate.setDate(startDate.getDate()+days);
  endDate.setDate(endDate.getDate()+days);
  apply();
}

/* ELEMENT SHORTCUTS */
const grossEl = document.getElementById("gross");
const profitEl = document.getElementById("profit");
const refundEl = document.getElementById("refund");
const chartCanvas = document.getElementById("chart");

</script>

</body>
</html>
