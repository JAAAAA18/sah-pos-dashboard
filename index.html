<head>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f3f4f6;
    }

    .header {
      position: sticky;
      top: 0;
      background: #16a34a;
      color: white;
      padding: 14px 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hamburger {
      cursor: pointer;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: white;
      transition: 0.3s;
      z-index: 1000;
      overflow: auto;
    }

    .drawer.open {
      left: 0;
    }

    .overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.3);
      display: none;
    }

    .overlay.show {
      display: block;
    }

    .menu-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f1f1f1;
      font-size: 14px;
    }

    .container {
      padding: 18px;
    }

    .range-wrapper {
      background: #e5e5e5;
      padding: 12px;
    }

    .range-box {
      display: flex;
      align-items: center;
      width: 100%;
      background: white;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    .range-btn {
      border: none;
      background: #f9fafb;
      width: 48px;
      height: 48px;
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
    }

    .range-btn:last-child {
      border-right: none;
      border-left: 1px solid #e5e7eb;
    }

    .range-date {
      flex: 1;
      padding: 0 12px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-width: 0;
    }

    .cards {
      display: flex;
      gap: 12px;
      overflow-x: auto;
    }

    .cards::-webkit-scrollbar {
      display: none;
    }

    .card {
      min-width: 140px;
      background: white;
      padding: 14px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .panel {
      background: white;
      padding: 14px;
      border-radius: 12px;
      margin-top: 14px;
    }

    #categoryView {
      display: none;
      padding: 18px;
    }
  </style>
</head>

  <!-- CATEGORY VIEW -->
  <!-- CATEGORY VIEW -->
<div id="categoryView">

  <div class="range-wrapper">

    <div class="range-box">

  </div>
    <div class="panel">

      <div style="font-weight:bold; margin-bottom:10px;">
        EXPORT
      </div>

    <div
      style="
        display:grid;
        grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
        gap:10px;
        font-size:13px;
        color:#6b7280;
        padding-bottom:10px;
        border-bottom:1px solid #e5e7eb;
        font-weight:bold;
      "
    >
      <div>Category</div>
      <div style="text-align:center;">Items sold</div>
      <div style="text-align:right;">Cash</div>
      <div style="text-align:right;">GCash</div>
      <div style="text-align:right;">Bank</div>
      <div style="text-align:right;">Net sales</div>
      <div style="text-align:right;">Cost of goods</div>
      <div style="text-align:right;">Gross profit</div>
    </div>

      <div id="categoryTable"></div>
    </div>
  </div>

  <script>
    /* DRAWER */
    function toggleDrawer() {
      drawer.classList.toggle("open");
      overlay.classList.toggle("show");
    }

    /* FIREBASE */
    const firebaseConfig = {
      apiKey: "AIzaSyAKP2N3Jm5BQoK9QZyhV18cjVC8TKtrgBk",
      authDomain: "sah-bacoor-pos.firebaseapp.com",
      projectId: "sah-bacoor-pos",
      storageBucket: "sah-bacoor-pos.firebasestorage.app",
      messagingSenderId: "197548582029",
      appId: "1:197548582029:web:d3919bfdf59857339b2ec4",
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();

    /* GOOGLE LOGIN */
    const provider = new firebase.auth.GoogleAuthProvider();

    function login() {
      firebase.auth()
        .signInWithPopup(provider)
        .then(result => {
          const user = result.user;
          location.href = location.pathname + "?uid=" + user.uid;
        })
        .catch(err => {
          alert(err.message);
        });
    }

    /* AUTH */
    firebase.auth().onAuthStateChanged(user => {
      userEmail.innerText = user ? user.email : "Not logged in";
    });

    /* DATE RANGE */
    const uid = new URLSearchParams(location.search).get("uid");

    if (!uid) {
      loginBar.style.display = "block";
    }

    let allData = [];
    let chart;

    let startDate = new Date();
    let endDate = new Date();
    let categoryStartDate = new Date();
    let categoryEndDate = new Date();

    categoryStartDate.setDate(categoryEndDate.getDate() - 6);
    startDate.setDate(endDate.getDate() - 6);

    function format(d) {
      return d.toLocaleDateString("en-US", {
        month: "short",
        day: "numeric"
      });
    }

    function updateRange() {
      rangeText.innerText =
        `${format(startDate)} → ${format(endDate)}`;
    }

/* APPLY FILTER */
function apply() {

  updateRange();

  // CATEGORY SINGLE DATE FILTER

let s = new Date(startDate);
let e = new Date(endDate);

s.setHours(0,0,0,0);
e.setHours(23,59,59,999);

let filtered = allData.filter(d => {
  const time = d.date.getTime();
  return time >= s.getTime() && time <= e.getTime();
});

  let gross = 0;
  let profit = 0;
  let refund = 0;

  filtered.forEach(d => {
    const payment =
    (d.paymentMethod || "").toLowerCase();

    const total = Number(d.total || 0);

    const itemProfit = Number(d.profit || 0);

    if (d.isRefund) {

      // subtract refund sales
      gross += total;

      // subtract refund profit
      profit += itemProfit;

      refund += Math.abs(total);

    } else {

      gross += total;

      profit += itemProfit;
    }

  });

  grossEl.innerText = "₱" + gross.toFixed(2);

  net.innerText = "₱" + gross.toFixed(2);

  profitEl.innerText = "₱" + profit.toFixed(2);

  refundEl.innerText = "₱" + refund.toFixed(2);

  updateChart(filtered);

  if (categoryView.style.display === "block") {
    renderCategory();
  }
}

function updateChart(data) {

  let sales1Map = {};

  data.forEach(d => {

    let key = d.date.toDateString();

    if (!sales1Map[key]) sales1Map[key] = 0;

    (d.items || []).forEach(item => {

      const category =
        (item.category || "").toLowerCase();

      const total =
        Number(item.price || 0) *
        Number(item.qty || 1);

      // REFUND = subtract
      const finalTotal = d.isRefund
        ? -total
        : total;

      // 🟢 SALES 1
      if (
        category == "shoes" ||
        category == "shoes bundle" ||
        category == "hydro" ||
        category == "hydro bundle" ||
        category == "socks" ||
        category == "socks bundle" ||
        category == "shirt" ||
        category == "shirts" ||
        category == "shirt bundle" ||
        category == "shirts bundle" ||
        category == "bola" ||
        category == "bola bundle" ||
        category == "jersey" ||
        category == "jersey bundle" ||
        category == "snap cap" ||
        category == "snap cap bundle" ||
        category == "closed cap" ||
        category == "closed cap bundle"
      ) {
        sales1Map[key] += finalTotal;
      }
    });

  });

  let labels = [];
  let sales1Values = [];
  let exportData = [];

  let cur = new Date(startDate);

  while (cur <= endDate) {

    let key = cur.toDateString();

    let sales1 = sales1Map[key] || 0;

    // prevent negative bars after full refund
    if (sales1 < 0) sales1 = 0;

    labels.push(format(cur));

    sales1Values.push(sales1);

    exportData.push({
      date: new Date(cur),
      sales1: sales1,
      total: sales1
    });

    cur.setDate(cur.getDate() + 1);
  }

  renderTable(exportData);

  if (chart) chart.destroy();

  chart = new Chart(chartCanvas, {

    type: "bar",

    data: {
      labels,

      datasets: [

        {
          label: "Baclaran Sales",
          data: sales1Values,
          backgroundColor: "#16a34a",
          barThickness: 12,
        }
      ]
    },

    options: {
      responsive: true,
      plugins: {
        legend: {
          display: true
        }
      }
    }

  });
}

    function renderTable(data) {

  tableRows.innerHTML = "";

  data.reverse().forEach(r => {

    let div = document.createElement("div");

    div.style.display = "flex";
    div.style.justifyContent = "space-between";
    div.style.gap = "10px";
    div.style.padding = "6px 0";

    div.innerHTML = `
      <div style="flex:1;">
        ${r.date.toLocaleDateString()}
      </div>

      <div style="flex:1; text-align:right; color:#16a34a;">
        ₱${r.sales1.toLocaleString()}
      </div>

      <div style="flex:1; text-align:right; font-weight:bold;">
        ₱${r.total.toLocaleString()}
      </div>
    `;

        tableRows.appendChild(div);
      });
    }


    function renderCategory() {

      let map = {};

      categoryDateText.innerText =
        `${categoryStartDate.toLocaleDateString("en-US", {
          month: "short",
          day: "numeric"
        })} → ${categoryEndDate.toLocaleDateString("en-US", {
          month: "short",
          day: "numeric"
        })}`;

      let s = new Date(categoryStartDate);
      let e = new Date(categoryEndDate);

      s.setHours(0,0,0,0);
      e.setHours(23,59,59,999);

      let filtered = allData.filter(d =>
        d.date >= s &&
        d.date <= e
      );

      filtered.forEach(d => {

        let payment =
          (d.paymentMethod || "").toLowerCase();

        if (!payment) {
          if ((d.cash || 0) > 0) {
            payment = "cash";
          } else if ((d.gcash || 0) > 0) {
            payment = "gcash";
          } else if ((d.bank || 0) > 0) {
            payment = "bank";
          }
        }

        console.log(
          "PAYMENT:",
          payment,
          "CASH:", d.cash,
          "GCASH:", d.gcash,
          "BANK:", d.bank
        );

        (d.items || []).forEach(item => {

          let cat = item.category || "Uncategorized";

          let qty =
            Number(item.qty || 1);

          let price =
            Number(item.price || 0);

          let cost =
            Number(item.cost || 0);

          let sales = price * qty;
          let totalCost = cost * qty;
          let grossProfit = sales - totalCost;

          if (!map[cat]) {

            map[cat] = {
              qty: 0,
              sales: 0,
              cost: 0,
              profit: 0,
              cash: 0,
              gcash: 0,
              bank: 0
            };  
          }

          const sign = d.isRefund ? -1 : 1;

            map[cat].qty += qty * sign;
            map[cat].sales += sales * sign;
            map[cat].cost += totalCost * sign;
            map[cat].profit += grossProfit * sign;

            // Use actual payment amounts from Firestore
            const ratio = d.total > 0 ? sales / d.total : 0;

            map[cat].cash += (d.cash || 0) * ratio * sign;
            map[cat].gcash += (d.gcash || 0) * ratio * sign;
            map[cat].bank += (d.bank || 0) * ratio * sign;

        });

      });

      categoryTable.innerHTML = "";

      Object.keys(map).forEach(cat => {

        let row = map[cat];

        if (
          row.qty <= 0 &&
          row.sales <= 0
        ) {
          return;
        }

        let div = document.createElement("div");

        div.style.display = "grid";

        div.style.gridTemplateColumns =
          "2fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr";

        div.style.padding = "14px 0";

        div.style.borderBottom =
          "1px solid #e5e7eb";

        div.style.alignItems = "center";

        div.innerHTML = `

          <div>${cat}</div>

          <div style="text-align:center;">
            ${row.qty}
          </div>

          <div style="text-align:right;">
            ${row.cash.toLocaleString()}
          </div>

          <div style="text-align:right;">
            ${row.gcash.toLocaleString()}
          </div>

          <div style="text-align:right;">
            ${row.bank.toLocaleString()}
          </div>

          <div style="text-align:right;">
            ${row.sales.toLocaleString()}
          </div>

          <div style="text-align:right;">
            ${row.cost.toLocaleString()}
          </div>

          <div style="
            text-align:right;
            font-weight:bold;
            color:#16a34a;
          ">
            ${row.profit.toLocaleString()}
          </div>

          `;

        categoryTable.appendChild(div);

      });

    }

    /* NAVIGATION */
    function openCategory() {
      document.querySelector(".container").style.display = "none";

      categoryView.style.display = "block";

      toggleDrawer();

      headerTitle.innerHTML = `
        <div class="hamburger" onclick="toggleDrawer()">☰</div>
        Sales by category
      `;

      renderCategory();
    }

    function backToDashboard() {
      document.querySelector(".container").style.display = "block";

      categoryView.style.display = "none";

      toggleDrawer();

      headerTitle.innerHTML = `
        <div class="hamburger" onclick="toggleDrawer()">☰</div>
        Sales summary
      `;
    }

    /* FIRESTORE */
    if (uid) {
      mainContainer.style.display = "block";

      db.collection("users")
  .doc(uid)
  .collection("sales")
  .onSnapshot(snap => {

    allData = [];

    snap.forEach(doc => {

      let d = doc.data();

      console.log("🔥 RAW FIREBASE DOC:", d);

      if (!d.createdAt) return;

      const parsedDate = d.createdAt?.toDate
        ? d.createdAt.toDate()
        : new Date(d.createdAt);

      console.log("📅 PARSED DATE:", parsedDate);

      allData.push({
        total: Number(d.total || 0),
        profit: Number(d.profit || 0),

        cash: Number(d.cash || 0),
        gcash: Number(d.gcash || 0),
        bank: Number(d.bank || 0),

        isRefund: d.isRefund || false,

        paymentMethod:
          d.paymentMethod ||
          d.paymentType ||
          d.payment ||
          "",

        date: parsedDate,
        items: d.items || []
      });
    });

    console.log("📊 ALL DATA DATES:");
    console.log(allData.map(x => x.date));

    apply();
  });
    }

      function openCategoryCalendar() {
        calendarModal.style.display = "flex";
        calendarTitle.innerText =
          "Sales by category";

        endPicker.parentElement.style.display =
          "block";

        startPicker.previousElementSibling.innerText =
          "Start date";

        startPicker.value =
          categoryStartDate
            .toISOString()
            .split("T")[0];

        endPicker.value =
          categoryEndDate
            .toISOString()
            .split("T")[0];
      }

    function openCalendar() {

      calendarModal.style.display = "flex";

      if (categoryView.style.display === "block") {

        calendarTitle.innerText =
          "Sales by category";

        // hide end date
        endPicker.parentElement.style.display =
          "none";

        startPicker.previousElementSibling.innerText =
          "Select date";

        startPicker.value =
          categorySelectedDate
            ? categorySelectedDate
                .toISOString()
                .split("T")[0]
            : new Date()
                .toISOString()
                .split("T")[0];

      } else {

        calendarTitle.innerText =
          "Sales summary";

        // show end date
        endPicker.parentElement.style.display =
          "block";

        startPicker.previousElementSibling.innerText =
          "Start date";

        startPicker.value =
          startDate.toISOString().split("T")[0];

        endPicker.value =
          endDate.toISOString().split("T")[0];
      }
    }

    function closeCalendar() {

      calendarModal.style.display = "none";
    }

    function applyCalendar() {

      if (categoryView.style.display === "block") {

        categoryStartDate =
          new Date(startPicker.value);

        categoryEndDate =
          new Date(endPicker.value);

        renderCategory();

      } else {

        startDate =
          new Date(startPicker.value);

        endDate =
          new Date(endPicker.value);

        apply();
      }

      closeCalendar();
    }

    /* MOVE SALES SUMMARY DATE */
    function move(days) {

      startDate.setDate(
        startDate.getDate() + days
      );

      endDate.setDate(
        endDate.getDate() + days
      );

      apply();
    }

    /* MOVE CATEGORY DATE */
    function moveCategory(days) {
        categoryStartDate.setDate(
        categoryStartDate.getDate() + days
      );

      categoryEndDate.setDate(
        categoryEndDate.getDate() + days
      );

      renderCategory();
    }

    /* ELEMENTS */
    const grossEl = document.getElementById("gross");
    const profitEl = document.getElementById("profit");
    const refundEl = document.getElementById("refund");
    const chartCanvas = document.getElementById("chart");
  </script>
