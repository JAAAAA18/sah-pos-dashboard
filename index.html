<!DOCTYPE html>
<html>
<head>
  <title>SAH POS Dashboard</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f3f4f6;
    }

    .header {
      position: sticky;
      top: 0;
      background: #16a34a;
      color: white;
      padding: 14px 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hamburger {
      cursor: pointer;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: white;
      transition: 0.3s;
      z-index: 1000;
      overflow: auto;
    }

    .drawer.open {
      left: 0;
    }

    .overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.3);
      display: none;
    }

    .overlay.show {
      display: block;
    }

    .menu-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f1f1f1;
      font-size: 14px;
    }

    .container {
      padding: 18px;
    }

    .range-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      background: white;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .cards {
      display: flex;
      gap: 12px;
      overflow-x: auto;
    }

    .cards::-webkit-scrollbar {
      display: none;
    }

    .card {
      min-width: 140px;
      background: white;
      padding: 14px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .panel {
      background: white;
      padding: 14px;
      border-radius: 12px;
      margin-top: 14px;
    }

    #categoryView {
      display: none;
      padding: 18px;
    }
  </style>
</head>

<body>

  <!-- DRAWER -->
  <div class="drawer" id="drawer">
    <div style="padding:16px; border-bottom:1px solid #eee;">
      <div style="font-weight:bold;">Owner</div>
      <div id="userEmail" style="font-size:12px;">Loading...</div>
    </div>

    <div style="padding:10px 16px; font-weight:bold;">
      Reports
    </div>

    <div class="menu-item" onclick="backToDashboard()">
      Sales summary
    </div>

    <div class="menu-item" onclick="openCategory()">
      Sales by category
    </div>
  </div>

  <div class="overlay" id="overlay" onclick="toggleDrawer()"></div>

  <!-- HEADER -->
  <div class="header" id="headerTitle">
    <div class="hamburger" onclick="toggleDrawer()">☰</div>
    Sales summary
  </div>

  <!-- LOGIN BAR -->
  <div
    id="loginBar"
    style="
      display:none;
      padding:12px;
      background:white;
      border-bottom:1px solid #eee;
    "
  >
    <button
      onclick="login()"
      style="
        width:100%;
        padding:12px;
        border:none;
        border-radius:10px;
        background:#16a34a;
        color:white;
        font-weight:bold;
      "
    >
      Login with Google
    </button>
  </div>

  <!-- DASHBOARD -->
  <div class="container" id="mainContainer" style="display:none;">

    <div class="range-bar">
      <button onclick="move(-7)">◀</button>
      <div id="rangeText"></div>
      <button onclick="move(7)">▶</button>
    </div>

    <div class="cards">
      <div class="card">
        <div>Gross Sales</div>
        <div id="gross">₱0</div>
      </div>

      <div class="card">
        <div>Net Sales</div>
        <div id="net">₱0</div>
      </div>

      <div class="card">
        <div>Profit</div>
        <div id="profit">₱0</div>
      </div>

      <div class="card">
        <div>Refund</div>
        <div id="refund">₱0</div>
      </div>
    </div>

    <div class="panel">
      <canvas id="chart"></canvas>

      <div style="margin-top:20px;">
        <div style="font-weight:bold;">EXPORT</div>

        <div
          style="
            display:flex;
            justify-content:space-between;
            font-size:13px;
            color:#6b7280;
            gap:10px;
          "
        >
          <div style="flex:1;">Date</div>
          <div style="flex:1; text-align:right;">Sales 1</div>
          <div style="flex:1; text-align:right;">Sales 2</div>
          <div style="flex:1; text-align:right;">Total</div>
        </div>

        <div id="tableRows"></div>
      </div>
    </div>
  </div>

  <!-- CATEGORY VIEW -->
  <div id="categoryView">
    <div class="panel">

      <div style="font-weight:bold; margin-bottom:10px;">
        EXPORT
      </div>

      <div
        style="
          display:flex;
          justify-content:space-between;
          font-size:13px;
          color:#6b7280;
        "
      >
        <div>Category</div>
        <div>Items Sold</div>
        <div>Net Sales</div>
      </div>

      <div id="categoryTable"></div>
    </div>
  </div>

  <script>
    /* DRAWER */
    function toggleDrawer() {
      drawer.classList.toggle("open");
      overlay.classList.toggle("show");
    }

    /* FIREBASE */
    const firebaseConfig = {
      apiKey: "AIzaSyAKP2N3Jm5BQoK9QZyhV18cjVC8TKtrgBk",
      authDomain: "sah-bacoor-pos.firebaseapp.com",
      projectId: "sah-bacoor-pos",
      storageBucket: "sah-bacoor-pos.firebasestorage.app",
      messagingSenderId: "197548582029",
      appId: "1:197548582029:web:d3919bfdf59857339b2ec4",
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();

    /* GOOGLE LOGIN */
    const provider = new firebase.auth.GoogleAuthProvider();

    function login() {
      firebase.auth()
        .signInWithPopup(provider)
        .then(result => {
          const user = result.user;
          location.href = location.pathname + "?uid=" + user.uid;
        })
        .catch(err => {
          alert(err.message);
        });
    }

    /* AUTH */
    firebase.auth().onAuthStateChanged(user => {
      userEmail.innerText = user ? user.email : "Not logged in";
    });

    /* DATE RANGE */
    const uid = new URLSearchParams(location.search).get("uid");

    if (!uid) {
      loginBar.style.display = "block";
    }

    let allData = [];
    let chart;

    let startDate = new Date();
    let endDate = new Date();

    startDate.setDate(endDate.getDate() - 6);

    function format(d) {
      return d.toLocaleDateString("en-US", {
        month: "short",
        day: "numeric"
      });
    }

    function updateRange() {
      rangeText.innerText =
        `${format(startDate)} → ${format(endDate)}`;
    }

    /* APPLY FILTER */
      /* APPLY FILTER */
/* APPLY FILTER */
function apply() {

  updateRange();

  let s = new Date(startDate);
  let e = new Date(endDate);

  s.setHours(0,0,0,0);
  e.setHours(23,59,59,999);

  let filtered = allData.filter(d =>
    d.date >= s && d.date <= e
  );

  let gross = 0;
  let profit = 0;
  let refund = 0;

  filtered.forEach(d => {

    const total = Number(d.total || 0);

    const itemProfit = Number(d.profit || 0);

    if (d.isRefund) {

      // subtract refund sales
      gross += total;

      // subtract refund profit
      profit += itemProfit;

      refund += Math.abs(total);

    } else {

      gross += total;

      profit += itemProfit;
    }

  });

  grossEl.innerText = "₱" + gross.toFixed(2);

  net.innerText = "₱" + gross.toFixed(2);

  profitEl.innerText = "₱" + profit.toFixed(2);

  refundEl.innerText = "₱" + refund.toFixed(2);

  updateChart(filtered);

  if (categoryView.style.display === "block") {
    renderCategory();
  }
}

function updateChart(data) {

  let sales1Map = {};
  let sales2Map = {};

  data.forEach(d => {

    let key = d.date.toDateString();

    if (!sales1Map[key]) sales1Map[key] = 0;
    if (!sales2Map[key]) sales2Map[key] = 0;

    (d.items || []).forEach(item => {

      const category =
        (item.category || "").toLowerCase();

      const total =
        Number(item.price || 0) *
        Number(item.qty || 1);

      // REFUND = subtract
      const finalTotal = d.isRefund
        ? -total
        : total;

      // 🟢 SALES 1
      if (
        category === "shoes" ||
        category === "shoes bundle" ||
        category === "hydro" ||
        category === "hydro bundle"
      ) {
        sales1Map[key] += finalTotal;
      }

      // 🔴 SALES 2
      if (
        category === "shoes2" ||
        category === "shoes bundle2" ||
        category === "hydro2" ||
        category === "hydro bundle2"
      ) {
        sales2Map[key] += finalTotal;
      }

    });

  });

  let labels = [];
  let sales1Values = [];
  let sales2Values = [];
  let exportData = [];

  let cur = new Date(startDate);

  while (cur <= endDate) {

    let key = cur.toDateString();

    let sales1 = sales1Map[key] || 0;
    let sales2 = sales2Map[key] || 0;

    // prevent negative bars after full refund
    if (sales1 < 0) sales1 = 0;
    if (sales2 < 0) sales2 = 0;

    labels.push(format(cur));

    sales1Values.push(sales1);
    sales2Values.push(sales2);

    exportData.push({
      date: new Date(cur),
      sales1: sales1,
      sales2: sales2,
      total: sales1 + sales2
    });

    cur.setDate(cur.getDate() + 1);
  }

  renderTable(exportData);

  if (chart) chart.destroy();

  chart = new Chart(chartCanvas, {

    type: "bar",

    data: {
      labels,

      datasets: [

        {
          label: "Sales 1",
          data: sales1Values,
          backgroundColor: "#16a34a",
          barThickness: 12,
        },

        {
          label: "Sales 2",
          data: sales2Values,
          backgroundColor: "#dc2626",
          barThickness: 12,
        }

      ]
    },

    options: {
      responsive: true,
      plugins: {
        legend: {
          display: true
        }
      }
    }

  });
}

    function renderTable(data) {

  tableRows.innerHTML = "";

  data.reverse().forEach(r => {

    let div = document.createElement("div");

    div.style.display = "flex";
    div.style.justifyContent = "space-between";
    div.style.gap = "10px";
    div.style.padding = "6px 0";

    div.innerHTML = `

      <div style="flex:1;">
        ${r.date.toLocaleDateString()}
      </div>

      <div style="flex:1; text-align:right; color:#16a34a;">
        ₱${r.sales1.toLocaleString()}
      </div>

      <div style="flex:1; text-align:right; color:#dc2626;">
        ₱${r.sales2.toLocaleString()}
      </div>

      <div style="flex:1; text-align:right; font-weight:bold;">
        ₱${r.total.toLocaleString()}
      </div>

    `;

    tableRows.appendChild(div);
  });
}

    /* CATEGORY */
/* CATEGORY */
function renderCategory() {

  let map = {};

  allData.forEach(d => {

    // ✅ SKIP REFUND DOCUMENTS
    if (d.isRefund) {
      return;
    }

    (d.items || []).forEach(item => {

      let cat =
        item.category || "Uncategorized";

      let qty =
        Number(item.qty || 1);

      let total =
        Number(item.price || 0) * qty;

      if (!map[cat]) {

        map[cat] = {
          qty: 0,
          total: 0
        };
      }

      // ✅ REFUND = SUBTRACT
      if (d.isRefund) {

        map[cat].qty -= qty;

        map[cat].total -= total;

      } else {

        map[cat].qty += qty;

        map[cat].total += total;
      }

      // ✅ PREVENT NEGATIVE VALUES
      if (map[cat].qty < 0) {
        map[cat].qty = 0;
      }

      if (map[cat].total < 0) {
        map[cat].total = 0;
      }
          });
        });

  categoryTable.innerHTML = "";

  Object.keys(map).forEach(cat => {

    let row = map[cat];

    let div = document.createElement("div");

    div.style.display = "flex";

    div.style.justifyContent =
      "space-between";

    div.style.padding = "6px 0";

    div.innerHTML = `

      <div>${cat}</div>

      <div>${row.qty}</div>

      <div>
        ₱${row.total.toLocaleString()}
      </div>

    `;

    categoryTable.appendChild(div);
  });
}

    /* NAVIGATION */
    function openCategory() {
      document.querySelector(".container").style.display = "none";

      categoryView.style.display = "block";

      toggleDrawer();

      headerTitle.innerHTML = `
        <div class="hamburger" onclick="toggleDrawer()">☰</div>
        Sales by category
      `;

      renderCategory();
    }

    function backToDashboard() {
      document.querySelector(".container").style.display = "block";

      categoryView.style.display = "none";

      toggleDrawer();

      headerTitle.innerHTML = `
        <div class="hamburger" onclick="toggleDrawer()">☰</div>
        Sales summary
      `;
    }

    /* FIRESTORE */
    if (uid) {
      mainContainer.style.display = "block";

      db.collection("users")
        .doc(uid)
        .collection("sales")
        .onSnapshot(snap => {

          allData = [];

          snap.forEach(doc => {

            let d = doc.data();

            if (!d.createdAt) return;

            allData.push({
              total: Number(d.total || 0),
              profit: Number(d.profit || 0),
              isRefund: d.isRefund || false,
              date: d.createdAt.toDate(),
              items: d.items || []
            });
          });

          apply();
        });
    }

    /* MOVE DATE */
    function move(days) {
      startDate.setDate(startDate.getDate() + days);
      endDate.setDate(endDate.getDate() + days);

      apply();
    }

    /* ELEMENTS */
    const grossEl = document.getElementById("gross");
    const profitEl = document.getElementById("profit");
    const refundEl = document.getElementById("refund");
    const chartCanvas = document.getElementById("chart");
  </script>

</body>
</html>
