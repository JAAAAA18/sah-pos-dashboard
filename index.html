<!DOCTYPE html>
<html>
<head>
  <title>SAH POS Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body { margin:0; font-family:Arial; background:#f3f4f6; }

    .header {
      position:sticky;
      top:0;
      background:#111827;
      color:white;
      padding:14px;
      display:flex;
      align-items:center;
      gap:10px;
      z-index:10;
    }

    .menu-btn { font-size:22px; cursor:pointer; }

    .drawer {
      position:fixed;
      left:-260px;
      top:0;
      width:260px;
      height:100%;
      background:#111827;
      color:white;
      transition:0.3s;
      z-index:1000;
    }

    .drawer.open { left:0; }

    .drawer div {
      padding:14px 20px;
      border-bottom:1px solid rgba(255,255,255,0.1);
      cursor:pointer;
    }

    .drawer div:hover { background:#1f2937; }

    .overlay {
      position:fixed;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.4);
      display:none;
      z-index:999;
    }

    .overlay.show { display:block; }

    .container { padding:18px; }

    .range-bar {
      display:flex;
      justify-content:center;
      gap:12px;
      background:white;
      padding:12px;
      border-radius:10px;
      margin-bottom:14px;
    }

    .cards {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
      gap:12px;
    }

    .card {
      background:white;
      padding:14px;
      border-radius:12px;
    }

    .label { font-size:12px; color:#6b7280; }
    .value { font-size:20px; font-weight:bold; }

    .panel {
      background:white;
      padding:14px;
      border-radius:12px;
      margin-top:12px;
    }
  </style>
</head>

<body>

<!-- DRAWER -->
<div id="drawer" class="drawer">
  <div onclick="closeDrawer()">Dashboard</div>
  <div onclick="scrollToCategory()">Sales by Category</div>
</div>

<div id="overlay" class="overlay" onclick="closeDrawer()"></div>

<!-- HEADER -->
<div class="header">
  <span class="menu-btn" onclick="openDrawer()">☰</span>
  SAH POS • Analytics
</div>

<div class="container">

  <!-- RANGE -->
  <div class="range-bar">
    <button onclick="move(-7)">◀</button>
    <div id="rangeText"></div>
    <button onclick="move(7)">▶</button>
  </div>

  <!-- CARDS -->
  <div class="cards">
    <div class="card"><div class="label">Gross Sales</div><div class="value" id="gross">₱0</div></div>
    <div class="card"><div class="label">Net Sales</div><div class="value" id="net">₱0</div></div>
    <div class="card"><div class="label">Profit</div><div class="value" id="profit">₱0</div></div>
    <div class="card"><div class="label">Refund</div><div class="value" id="refund">₱0</div></div>
  </div>

  <!-- MAIN CHART -->
  <div class="panel">
    <canvas id="chart"></canvas>
  </div>

  <!-- CATEGORY -->
  <div class="panel" id="categorySection">
    <div style="font-weight:bold; margin-bottom:10px;">
      Sales by Category
    </div>

    <canvas id="categoryChart"></canvas>
    <div id="categoryList" style="margin-top:15px;"></div>
  </div>

</div>

<script>

/* DRAWER */
function openDrawer(){
  drawer.classList.add("open");
  overlay.classList.add("show");
}
function closeDrawer(){
  drawer.classList.remove("open");
  overlay.classList.remove("show");
}
function scrollToCategory(){
  closeDrawer();
  document.getElementById("categorySection")
    .scrollIntoView({behavior:"smooth"});
}

const firebaseConfig = {
  apiKey: "AIzaSyAKP...",
  authDomain: "sah-bacoor-pos.firebaseapp.com",
  projectId: "sah-bacoor-pos",
  storageBucket: "sah-bacoor-pos.firebasestorage.app",
  messagingSenderId: "197548582029",
  appId: "1:197548582029:web:d3919bfdf59857339b2ec4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function getUIDFromURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get("uid");
}

/* GLOBALS */
let chart;
let categoryChart;
let allData = [];

let startDate = new Date();
let endDate = new Date();
startDate.setDate(endDate.getDate() - 6);

function format(date){
  return date.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}

function updateRange(){
  rangeText.innerText =
  `${format(startDate)} → ${format(endDate)}`;
}

window.move = function(days){
  startDate.setDate(startDate.getDate()+days);
  endDate.setDate(endDate.getDate()+days);
  apply();
};

function apply(){

  let s=new Date(startDate);
  let e=new Date(endDate);
  s.setHours(0,0,0,0);
  e.setHours(23,59,59,999);

  let filtered=allData.filter(d=>d.date>=s&&d.date<=e);

  updateRange();
  render(filtered, s, e);
}

/* MAIN RENDER */
function render(data, start, end){

  let gross=0, profit=0, refund=0;
  let map={};

  data.forEach(d=>{
    gross+=d.total;
    profit+=d.profit||0;

    if(d.isRefund){
      refund+=Math.abs(d.total||0);
    }

    let key=d.date.toDateString();
    map[key]=(map[key]||0)+d.total;
  });

  grossEl.innerText="₱"+gross.toFixed(2);
  netEl.innerText="₱"+gross.toFixed(2);
  profitEl.innerText="₱"+profit.toFixed(2);
  refundEl.innerText="₱"+refund.toFixed(2);

  updateChart(Object.keys(map),Object.values(map));
  renderCategory(data);
}

/* MAIN CHART */
function updateChart(labels, values){
  if(chart) chart.destroy();

  chart=new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{
      labels,
      datasets:[{data:values, backgroundColor:"#16a34a"}]
    }
  });
}

/* CATEGORY FIXED */
function renderCategory(data){

  let map={};

  data.forEach(sale=>{

    if(sale.items && sale.items.length>0){
      sale.items.forEach(item=>{
        let cat=item.category||"Other";
        let total=(item.price||0)*(item.qty||1);
        map[cat]=(map[cat]||0)+total;
      });
    } else {
      map["Sales"]=(map["Sales"]||0)+(sale.total||0);
    }

  });

  let labels=Object.keys(map);
  let values=Object.values(map);

  if(labels.length===0){
    categoryList.innerHTML="No data";
    return;
  }

  if(categoryChart) categoryChart.destroy();

  categoryChart=new Chart(document.getElementById("categoryChart"),{
    type:"pie",
    data:{
      labels,
      datasets:[{data:values}]
    }
  });

  let totalAll=values.reduce((a,b)=>a+b,0);
  categoryList.innerHTML="";

  Object.entries(map)
    .sort((a,b)=>b[1]-a[1])
    .forEach(([cat,val])=>{

      let percent=totalAll?(val/totalAll*100).toFixed(1):0;

      let div=document.createElement("div");

      div.innerHTML=`
        <div style="display:flex; justify-content:space-between;">
          <div>${cat}</div>
          <div>₱${val.toLocaleString()} (${percent}%)</div>
        </div>
        <div style="height:6px;background:#eee;margin-top:4px;">
          <div style="width:${percent}%;background:#16a34a;height:100%;"></div>
        </div>
      `;

      categoryList.appendChild(div);
    });
}

/* LOAD FIREBASE */
const uid = getUIDFromURL();

if (!uid) {
  alert("No UID provided");
} else {

  db.collection("users")
    .doc(uid)
    .collection("sales")
    .onSnapshot(snapshot => {

      allData = [];

      snapshot.forEach(doc => {
        const d = doc.data();
        if (!d.createdAt) return;

        allData.push({
          total: Number(d.total || 0),
          profit: Number(d.profit || 0),
          isRefund: d.isRefund || false,
          items: d.items || [],
          date: d.createdAt.toDate()
        });
      });

      apply();
    });
}

</script>

</body>
</html>
