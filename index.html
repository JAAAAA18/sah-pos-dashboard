<!DOCTYPE html>
<html>
<head>
  <title>SAH POS Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    body { margin:0; font-family:Arial; background:#f3f4f6; overflow-x:hidden; }

    .header {
      position:sticky;
      top:0;
      background:#111827;
      color:white;
      padding:14px 18px;
      font-weight:bold;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .menu-btn { font-size:22px; cursor:pointer; }

    .drawer {
      position:fixed;
      top:0;
      left:-260px;
      width:260px;
      height:100%;
      background:#111827;
      color:white;
      transition:0.3s;
      z-index:1000;
      padding-top:20px;
    }

    .drawer.open { left:0; }

    .drawer div {
      padding:14px 20px;
      border-bottom:1px solid rgba(255,255,255,0.1);
      cursor:pointer;
    }

    .drawer div:hover { background:#1f2937; }

    .overlay {
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.4);
      display:none;
      z-index:999;
    }

    .overlay.show { display:block; }

    .container { padding:18px; }
    .range-bar { display:flex; justify-content:center; gap:12px; background:white; padding:12px; border-radius:10px; margin-bottom:14px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; }
    .card { background:white; padding:14px; border-radius:12px; }
    .label { font-size:12px; color:#6b7280; }
    .value { font-size:20px; font-weight:bold; }
    .panel { background:white; padding:14px; border-radius:12px; }

    @media (max-width:768px){
      .cards{grid-template-columns:repeat(2,1fr);}
      .value{font-size:16px;}
    }
  </style>
</head>

<body>

<!-- DRAWER -->
<div id="drawer" class="drawer">
  <div onclick="closeDrawer()">Dashboard</div>
  <div onclick="closeDrawer()">Sales</div>
  <div onclick="closeDrawer()">Receipts</div>
  <div onclick="closeDrawer()">Shift</div>
  <div onclick="closeDrawer()">BackOffice</div>
  <div onclick="closeDrawer()">Printers</div>
  <div onclick="closeDrawer()">Settings</div>

  <!-- ✅ ADDED -->
  <div onclick="scrollToCategory()">Sales by Category</div>
</div>

<div id="overlay" class="overlay" onclick="closeDrawer()"></div>

<div class="header">
  <span class="menu-btn" onclick="openDrawer()">☰</span>
  SAH POS • Analytics
</div>

<div class="container">

  <div class="range-bar">
    <button onclick="move(-7)">◀</button>
    <div id="rangeText"></div>
    <button onclick="move(7)">▶</button>
  </div>

  <div class="cards">
    <div class="card"><div class="label">Gross Sales</div><div class="value" id="gross">₱0</div></div>
    <div class="card"><div class="label">Net Sales</div><div class="value" id="net">₱0</div></div>
    <div class="card"><div class="label">Profit</div><div class="value" id="profit">₱0</div></div>
    <div class="card"><div class="label">Refund</div><div class="value" id="refund">₱0</div></div>
    <div class="card"><div class="label">Cash Balance</div><div class="value" id="cash">₱0</div></div>
  </div>

  <div class="panel">
    <canvas id="chart"></canvas>

    <!-- ✅ CATEGORY SECTION -->
    <hr style="margin:20px 0;">
    <div id="categorySection">
      <div style="font-weight:bold; margin-bottom:10px;">
        Sales by Category
      </div>
      <canvas id="categoryChart"></canvas>

      <!-- ✅ LOYVERSE STYLE LIST -->
      <div id="categoryList" style="margin-top:15px;"></div>
    </div>

    <div style="margin-top:20px;">
      <div style="font-weight:bold; margin-bottom:8px;">EXPORT</div>

      <div style="display:flex; justify-content:space-between; font-size:13px; color:#6b7280; padding:6px 0; border-bottom:1px solid #eee;">
        <div>Date</div>
        <div>Gross Sales</div>
      </div>

      <div id="tableRows"></div>
    </div>

  </div>

</div>

<script>

/* DRAWER */
function openDrawer(){
  document.getElementById("drawer").classList.add("open");
  document.getElementById("overlay").classList.add("show");
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

/* SCROLL */
function scrollToCategory(){
  closeDrawer();
  document.getElementById("categorySection")
    .scrollIntoView({ behavior: "smooth" });
}

const firebaseConfig = {
  apiKey: "AIzaSyAKP...",
  authDomain: "sah-bacoor-pos.firebaseapp.com",
  projectId: "sah-bacoor-pos",
  storageBucket: "sah-bacoor-pos.firebasestorage.app",
  messagingSenderId: "197548582029",
  appId: "1:197548582029:web:d3919bfdf59857339b2ec4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function getUIDFromURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get("uid");
}

function formatKey(date) {
  const d = new Date(date);
  return d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,'0') + "-" +
    String(d.getDate()).padStart(2,'0');
}

let chart;
let categoryChart;
let allData = [];
let exportData = [];

let startDate = new Date();
let endDate = new Date();
startDate.setDate(endDate.getDate() - 6);

function format(date){
  return date.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}

function updateRange(){
  document.getElementById("rangeText").innerText =
  `${format(startDate)} → ${format(endDate)}`;
}

window.move = function(days){
  startDate.setDate(startDate.getDate()+days);
  endDate.setDate(endDate.getDate()+days);
  apply();
};

function getDateRange(start, end) {
  let arr = [];
  let current = new Date(start);
  while (current <= end) {
    arr.push(new Date(current));
    current.setDate(current.getDate() + 1);
  }
  return arr;
}

function apply(){
  let s=new Date(startDate);
  let e=new Date(endDate);
  s.setHours(0,0,0,0);
  e.setHours(23,59,59,999);

  let filtered=allData.filter(d=>d.date>=s&&d.date<=e);

  updateRange();
  render(filtered, s, e);
}

function render(data, start, end){

  let gross=0, profit=0, refund=0;
  let map={};

  data.forEach(d=>{
    gross += d.total;
    profit += d.profit || 0;

    if (d.isRefund) {
      refund += Math.abs(d.total || 0);
    }

    let key = formatKey(d.date);
    map[key] = (map[key] || 0) + d.total;
  });

  document.getElementById("gross").innerText="₱"+gross.toFixed(2);
  document.getElementById("net").innerText="₱"+gross.toFixed(2);
  document.getElementById("profit").innerText="₱"+profit.toFixed(2);
  document.getElementById("refund").innerText="₱"+refund.toFixed(2);

  let fullDates = getDateRange(start, end);
  let labels = [];
  let values = [];

  exportData = [];

  fullDates.forEach(d=>{
    let key = formatKey(d);

    labels.push(format(d));
    values.push(map[key] || 0);

    exportData.push({
      date: key,
      sales: map[key] || 0
    });
  });

  updateChart(labels, values);
  renderTable(exportData);
  renderCategoryChart(data);
}

function updateChart(labels, values) {
  if (chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: "#16a34a"
      }]
    }
  });
}

/* CATEGORY (LOYVERSE STYLE) */
function renderCategoryChart(data) {
  let map = {};

  data.forEach(sale => {
    if (!sale.items) return;

    sale.items.forEach(item => {
      let cat = item.category || "Uncategorized";
      let total = (item.price || 0) * (item.qty || 1);
      map[cat] = (map[cat] || 0) + total;
    });
  });

  let labels = Object.keys(map);
  let values = Object.values(map);

  if (categoryChart) categoryChart.destroy();

  categoryChart = new Chart(document.getElementById("categoryChart"), {
    type: "pie",
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: [
          "#16a34a","#2563eb","#f59e0b","#ef4444","#8b5cf6","#14b8a6"
        ]
      }]
    }
  });

  // ✅ LOYVERSE LIST
  let totalAll = values.reduce((a,b)=>a+b,0);
  let list = document.getElementById("categoryList");
  list.innerHTML = "";

  let sorted = Object.entries(map).sort((a,b)=>b[1]-a[1]);

  sorted.forEach(([cat,val]) => {
    let percent = totalAll ? (val/totalAll*100).toFixed(1) : 0;

    let row = document.createElement("div");
    row.style.marginBottom = "10px";

    row.innerHTML = `
      <div style="display:flex; justify-content:space-between; font-size:14px;">
        <div>${cat}</div>
        <div>₱${val.toLocaleString()} (${percent}%)</div>
      </div>
      <div style="height:6px; background:#e5e7eb; border-radius:5px; margin-top:4px;">
        <div style="width:${percent}%; height:100%; background:#16a34a; border-radius:5px;"></div>
      </div>
    `;

    list.appendChild(row);
  });
}

function renderTable(data){
  let container = document.getElementById("tableRows");
  container.innerHTML = "";

  let reversed = [...data].reverse();

  reversed.forEach(row => {
    let date = new Date(row.date);

    let formattedDate = date.toLocaleDateString("en-US", {
      month: "short",
      day: "numeric",
      year: "numeric"
    });

    let div = document.createElement("div");

    div.style.display = "flex";
    div.style.justifyContent = "space-between";
    div.style.padding = "10px 0";
    div.style.borderBottom = "1px solid #f1f1f1";

    div.innerHTML = `
      <div>${formattedDate}</div>
      <div>₱${row.sales.toLocaleString()}</div>
    `;

    container.appendChild(div);
  });
}

const uid = getUIDFromURL();

if (!uid) {
  alert("No UID provided in URL");
} else {

  db.collection("users")
    .doc(uid)
    .collection("sales")
    .onSnapshot(snapshot => {

      allData = [];

      snapshot.forEach(doc => {
        const d = doc.data();
        if (!d.createdAt) return;

        allData.push({
          total: Number(d.total || 0),
          cost: Number(d.cost || 0),
          profit: Number(d.profit || 0),
          isRefund: d.isRefund || false,
          date: d.createdAt.toDate(),
          items: d.items || []
        });
      });

      apply();
    });
}

</script>

</body>
</html>
