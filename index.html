<!DOCTYPE html>
<html>
<head>
  <title>SAH POS Back Office</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body { margin:0; font-family:Arial; background:#f3f4f6; }

    /* HEADER */
    .header {
      position:sticky;
      top:0;
      background:#111827;
      color:white;
      padding:14px;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .menu-btn { font-size:22px; cursor:pointer; }

    /* DRAWER */
    .drawer {
      position:fixed;
      left:-260px;
      top:0;
      width:260px;
      height:100%;
      background:#111827;
      color:white;
      transition:0.3s;
      z-index:1000;
    }

    .drawer.open { left:0; }

    .drawer div {
      padding:14px 20px;
      border-bottom:1px solid rgba(255,255,255,0.1);
      cursor:pointer;
    }

    .drawer div:hover { background:#1f2937; }

    .overlay {
      position:fixed;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.4);
      display:none;
    }

    .overlay.show { display:block; }

    .container { padding:18px; }

    .cards {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
      gap:12px;
    }

    .card {
      background:white;
      padding:14px;
      border-radius:12px;
    }

    .label { font-size:12px; color:#6b7280; }
    .value { font-size:20px; font-weight:bold; }

    .panel {
      background:white;
      padding:14px;
      border-radius:12px;
      margin-top:12px;
    }
  </style>
</head>

<body>

<!-- DRAWER -->
<div id="drawer" class="drawer">
  <div onclick="closeDrawer()">Dashboard</div>
  <div onclick="scrollToCategory()">Sales by Category</div>
</div>

<div id="overlay" class="overlay" onclick="closeDrawer()"></div>

<!-- HEADER -->
<div class="header">
  <span class="menu-btn" onclick="openDrawer()">☰</span>
  SAH POS • Back Office
</div>

<div class="container">

  <!-- CARDS -->
  <div class="cards">
    <div class="card"><div class="label">Gross</div><div class="value" id="gross">₱0</div></div>
    <div class="card"><div class="label">Profit</div><div class="value" id="profit">₱0</div></div>
  </div>

  <!-- MAIN CHART -->
  <div class="panel">
    <canvas id="chart"></canvas>
  </div>

  <!-- CATEGORY -->
  <div class="panel" id="categorySection">
    <div style="font-weight:bold; margin-bottom:10px;">
      Sales by Category
    </div>

    <canvas id="categoryChart"></canvas>

    <div id="categoryList" style="margin-top:15px;"></div>
  </div>

</div>

<script>

/* DRAWER */
function openDrawer(){
  drawer.classList.add("open");
  overlay.classList.add("show");
}
function closeDrawer(){
  drawer.classList.remove("open");
  overlay.classList.remove("show");
}
function scrollToCategory(){
  closeDrawer();
  document.getElementById("categorySection")
    .scrollIntoView({behavior:"smooth"});
}

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "sah-bacoor-pos.firebaseapp.com",
  projectId: "sah-bacoor-pos"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* DATA */
let allData = [];
let chart, categoryChart;

/* LOAD DATA */
db.collection("users")
  .doc("YOUR_UID")
  .collection("sales")
  .onSnapshot(snap => {

    allData = [];

    snap.forEach(doc => {
      let d = doc.data();

      allData.push({
        total: Number(d.total || 0),
        profit: Number(d.profit || 0),
        items: d.items || [],
        date: d.createdAt?.toDate?.() || new Date()
      });
    });

    render();
  });

function render(){

  let gross=0, profit=0;
  let dailyMap = {};

  allData.forEach(d=>{
    gross+=d.total;
    profit+=d.profit;

    let key=d.date.toDateString();
    dailyMap[key]=(dailyMap[key]||0)+d.total;
  });

  grossEl.innerText="₱"+gross.toFixed(2);
  profitEl.innerText="₱"+profit.toFixed(2);

  updateChart(Object.keys(dailyMap), Object.values(dailyMap));
  renderCategory(allData);
}

/* MAIN CHART */
function updateChart(labels, values){
  if(chart) chart.destroy();

  chart=new Chart(chartCanvas,{
    type:"bar",
    data:{
      labels,
      datasets:[{data:values, backgroundColor:"#16a34a"}]
    }
  });
}

/* CATEGORY (LOYVERSE STYLE) */
function renderCategory(data){

  let map={};

  data.forEach(sale=>{
    sale.items.forEach(item=>{
      let cat=item.category||"Other";
      let total=(item.price||0)*(item.qty||1);
      map[cat]=(map[cat]||0)+total;
    });
  });

  let labels=Object.keys(map);
  let values=Object.values(map);

  if(categoryChart) categoryChart.destroy();

  categoryChart=new Chart(categoryChartCanvas,{
    type:"pie",
    data:{
      labels,
      datasets:[{data:values}]
    }
  });

  /* LIST */
  let totalAll=values.reduce((a,b)=>a+b,0);
  categoryList.innerHTML="";

  Object.entries(map)
    .sort((a,b)=>b[1]-a[1])
    .forEach(([cat,val])=>{

      let percent=(val/totalAll*100).toFixed(1);

      let div=document.createElement("div");

      div.innerHTML=`
        <div style="display:flex; justify-content:space-between;">
          <div>${cat}</div>
          <div>₱${val.toLocaleString()} (${percent}%)</div>
        </div>
        <div style="height:6px;background:#eee;margin-top:4px;">
          <div style="width:${percent}%;background:#16a34a;height:100%;"></div>
        </div>
      `;

      categoryList.appendChild(div);
    });
}

</script>

</body>
</html>
