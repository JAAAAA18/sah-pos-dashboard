<!DOCTYPE html>
<html>
<head>
  <title>SAH POS Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    body { margin:0; font-family:Arial; background:#f3f4f6; }

    .header {
      position:sticky;
      top:0;
      background:#16a34a;
      color:white;
      padding:14px 18px;
      font-weight:bold;
      display:flex;
      align-items:center;
      gap:12px;
    }

    .hamburger { cursor:pointer; font-size:20px; }

    .drawer {
      position:fixed;
      top:0;
      left:-280px;
      width:280px;
      height:100%;
      background:white;
      transition:0.3s;
      z-index:1000;
      padding:16px;
    }
    .drawer.open { left:0; }

    .overlay {
      position:fixed;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.3);
      display:none;
    }
    .overlay.show { display:block; }

    .container { padding:18px; }

    .range-bar {
      display:flex;
      justify-content:center;
      gap:12px;
      background:white;
      padding:12px;
      border-radius:10px;
      margin-bottom:14px;
    }

    /* SCROLLABLE CARDS */
    .cards {
      display:flex;
      overflow-x:auto;
      gap:12px;
      margin-bottom:14px;
    }
    .card {
      min-width:140px;
      background:white;
      padding:14px;
      border-radius:12px;
      flex-shrink:0;
    }

    .panel { 
      background:white; 
      padding:14px; 
      border-radius:12px; 
    }

    /* ✅ BIGGER CHART */
    .chart-container {
      width:100%;
      height:320px; /* 🔥 increased height */
    }

    /* Calendar */
    .calendar-modal {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.5);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:2000;
    }

    .calendar-box {
      background:white;
      padding:16px;
      border-radius:12px;
      width:90%;
      max-width:350px;
    }

    .calendar-grid {
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:5px;
      text-align:center;
      margin-top:10px;
    }

    .day {
      padding:10px;
      cursor:pointer;
      border-radius:6px;
    }

    .day:hover { background:#d1fae5; }
  </style>
</head>

<body>

<div class="drawer" id="drawer">
  <div style="font-weight:bold;">Owner</div>
  <div id="userEmail" style="font-size:12px; color:#555;"></div>

  <hr>

  <div onclick="alert('Sales summary')">Sales summary</div>
  <div onclick="alert('Sales by category')">Sales by category</div>
</div>

<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>

<div class="header">
  <div class="hamburger" onclick="toggleDrawer()">☰</div>
  Sales summary
</div>

<div class="container">

  <div class="range-bar">
    <button onclick="move(-7)">◀</button>
    <div id="rangeText" onclick="openCalendar()" style="cursor:pointer;"></div>
    <button onclick="move(7)">▶</button>
  </div>

  <div class="cards">
    <div class="card"><div>Gross Sales</div><div id="gross">₱0</div></div>
    <div class="card"><div>Net Sales</div><div id="net">₱0</div></div>
    <div class="card"><div>Profit</div><div id="profit">₱0</div></div>
    <div class="card"><div>Refund</div><div id="refund">₱0</div></div>
  </div>

  <div class="panel">

    <!-- ✅ BIGGER CHART WRAPPER -->
    <div class="chart-container">
      <canvas id="chart"></canvas>
    </div>

    <div style="margin-top:20px;">
      <div style="font-weight:bold;">EXPORT</div>

      <div style="display:flex; justify-content:space-between; font-size:13px; color:#6b7280;">
        <div>Date</div>
        <div>Gross Sales</div>
      </div>

      <div id="tableRows"></div>
    </div>

  </div>

</div>

<!-- Calendar -->
<div class="calendar-modal" id="calendarModal">
  <div class="calendar-box">
    <div id="calendarTitle"></div>
    <div class="calendar-grid" id="calendarGrid"></div>

    <div style="margin-top:10px; text-align:right;">
      <button onclick="closeCalendar()">Done</button>
    </div>
  </div>
</div>

<script>

function toggleDrawer(){
  drawer.classList.toggle("open");
  overlay.classList.toggle("show");
}

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyAKP...",
  authDomain: "sah-bacoor-pos.firebaseapp.com",
  projectId: "sah-bacoor-pos"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

firebase.auth().onAuthStateChanged(user=>{
  if(user){
    document.getElementById("userEmail").innerText = user.email;
  }
});

/* Data */
let allData=[];
let chart;

let startDate=new Date();
let endDate=new Date();
startDate.setDate(endDate.getDate()-6);

function format(d){
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}

function updateRange(){
  rangeText.innerText = `${format(startDate)} → ${format(endDate)}`;
}

/* Calendar */
function openCalendar(){
  calendarModal.style.display="flex";
  renderCalendar(new Date());
}

function closeCalendar(){
  calendarModal.style.display="none";
}

function renderCalendar(date){
  calendarGrid.innerHTML="";
  calendarTitle.innerText = date.toLocaleString("default",{month:"long",year:"numeric"});

  let year=date.getFullYear();
  let month=date.getMonth();

  let days=new Date(year,month+1,0).getDate();

  for(let d=1; d<=days; d++){
    let el=document.createElement("div");
    el.className="day";
    el.innerText=d;

    el.onclick=()=>{
      startDate=new Date(year,month,d);
      endDate=new Date(year,month,d);
      closeCalendar();
      apply();
    };

    calendarGrid.appendChild(el);
  }
}

/* Helpers */
function formatKey(date){
  let d=new Date(date);
  return d.toISOString().split("T")[0];
}

function getDateRange(start,end){
  let arr=[];
  let cur=new Date(start);
  while(cur<=end){
    arr.push(new Date(cur));
    cur.setDate(cur.getDate()+1);
  }
  return arr;
}

/* Apply */
function apply(){
  updateRange();

  let s=new Date(startDate);
  let e=new Date(endDate);
  s.setHours(0,0,0,0);
  e.setHours(23,59,59,999);

  let filtered=allData.filter(d=>d.date>=s&&d.date<=e);

  let gross=0, profit=0, refund=0;

  filtered.forEach(d=>{
    gross+=d.total;
    profit+=d.profit||0;
    if(d.isRefund) refund+=Math.abs(d.total||0);
  });

  grossEl.innerText="₱"+gross.toFixed(2);
  net.innerText="₱"+gross.toFixed(2);
  profitEl.innerText="₱"+profit.toFixed(2);
  refundEl.innerText="₱"+refund.toFixed(2);

  updateChart(filtered);
}

/* Chart */
function updateChart(data){

  let map={};

  data.forEach(d=>{
    let key=formatKey(d.date);
    map[key]=(map[key]||0)+d.total;
  });

  let dates=getDateRange(startDate,endDate);

  let labels=[], values=[], exportData=[];

  dates.forEach(d=>{
    let key=formatKey(d);
    let val=map[key]||0;

    labels.push(format(d));
    values.push(val);

    exportData.push({date:key,sales:val});
  });

  renderTable(exportData);

  if(chart) chart.destroy();

  chart=new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{
      labels,
      datasets:[{
        label:"Gross Sales",
        data:values,
        backgroundColor:"#16a34a",
        barThickness:12
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false /* 🔥 IMPORTANT for bigger chart */
    }
  });
}

/* Table */
function renderTable(data){
  tableRows.innerHTML="";

  data.reverse().forEach(r=>{
    let div=document.createElement("div");
    div.style.display="flex";
    div.style.justifyContent="space-between";

    div.innerHTML=`
      <div>${r.date}</div>
      <div>₱${r.sales.toLocaleString()}</div>
    `;

    tableRows.appendChild(div);
  });
}

/* Firestore */
db.collection("users")
.doc(new URLSearchParams(location.search).get("uid"))
.collection("sales")
.onSnapshot(snap=>{
  allData=[];

  snap.forEach(doc=>{
    let d=doc.data();
    if(!d.createdAt) return;

    allData.push({
      total:Number(d.total||0),
      profit:Number(d.profit||0),
      isRefund:d.isRefund||false,
      date:d.createdAt.toDate()
    });
  });

  apply();
});

/* Move */
function move(days){
  startDate.setDate(startDate.getDate()+days);
  endDate.setDate(endDate.getDate()+days);
  apply();
}

</script>

</body>
</html>
