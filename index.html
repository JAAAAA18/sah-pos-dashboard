<!DOCTYPE html>
<html>
<head>
  <title>SAH POS Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    body { margin:0; font-family:Arial; background:#f3f4f6; }
    .header { background:#111827; color:white; padding:14px; }
    .container { padding:18px; }
    .cards { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .card { background:white; padding:14px; border-radius:12px; }
  </style>
</head>

<body>

<div class="header">SAH POS • Analytics</div>

<div class="container">

  <div class="cards">
    <div class="card">Gross: <span id="gross">₱0</span></div>
    <div class="card">Profit: <span id="profit">₱0</span></div>
  </div>

  <canvas id="chart"></canvas>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAKP2N3Jm5BQoK9QZyhV18cjVC8TKtrgBk",
  authDomain: "sah-bacoor-pos.firebaseapp.com",
  projectId: "sah-bacoor-pos",
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

let chart;
let allData = [];

/* 🔥 AUTO LOGIN FROM TOKEN */
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

if (token) {
  auth.signInWithCustomToken(token)
    .then(() => console.log("✅ Auto login success"))
    .catch(err => console.error("❌ Token login error:", err));
}

/* ✅ USER DATA */
auth.onAuthStateChanged(user => {

  console.log("USER:", user ? user.uid : "NONE");

  if (!user) return;

  db.collection("users")
    .doc(user.uid)
    .collection("sales")
    .onSnapshot(snapshot => {

      let gross = 0;
      let profit = 0;
      let labels = [];
      let values = [];

      snapshot.forEach(doc => {
        const d = doc.data();
        gross += d.total || 0;
        profit += d.profit || 0;

        labels.push("Sale");
        values.push(d.total || 0);
      });

      document.getElementById("gross").innerText = gross;
      document.getElementById("profit").innerText = profit;

      if (chart) chart.destroy();

      chart = new Chart(document.getElementById("chart"), {
        type: "bar",
        data: {
          labels,
          datasets: [{
            data: values
          }]
        }
      });

    });

});

</script>

</body>
</html>
