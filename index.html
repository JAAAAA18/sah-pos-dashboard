<!DOCTYPE html>
<html>
<head>
  <title>SAH POS Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    body { margin:0; font-family:Arial; background:#f3f4f6; }

    .header {
      position:sticky;
      top:0;
      background:#16a34a;
      color:white;
      padding:14px 18px;
      font-weight:bold;
      display:flex;
      align-items:center;
      gap:12px;
    }

    .hamburger { cursor:pointer; }

    .drawer {
      position:fixed;
      top:0;
      left:-280px;
      width:280px;
      height:100%;
      background:white;
      transition:0.3s;
      z-index:1000;
      overflow:auto;
    }
    .drawer.open { left:0; }

    .overlay {
      position:fixed;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.3);
      display:none;
    }
    .overlay.show { display:block; }

    .menu-item {
      padding:12px 16px;
      cursor:pointer;
      border-bottom:1px solid #f1f1f1;
      font-size:14px;
    }
    .menu-item:hover { background:#f9fafb; }

    .container { padding:18px; }

    .range-bar {
      display:flex;
      justify-content:center;
      gap:12px;
      background:white;
      padding:12px;
      border-radius:10px;
      margin-bottom:14px;
    }

    .cards {
        display:flex;
        gap:12px;
        overflow-x:auto;
        padding-bottom:4px;
      }

      .cards::-webkit-scrollbar {
        display:none;
      }

    .card { background:white; padding:14px; border-radius:12px; }

    .panel { background:white; padding:14px; border-radius:12px; }

    .calendar-modal {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.5);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:2000;
    }

    .calendar-box {
      background:white;
      padding:16px;
      border-radius:12px;
      width:90%;
      max-width:350px;
    }

    .calendar-grid {
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:5px;
      text-align:center;
      margin-top:10px;
    }

    .day {
      padding:10px;
      cursor:pointer;
      border-radius:6px;
    }

    .day:hover { background:#d1fae5; }
  </style>
</head>

<body>

<!-- ✅ DRAWER -->
<div class="drawer" id="drawer">

  <div style="padding:16px; border-bottom:1px solid #eee;">
    <div style="font-weight:bold;">Owner</div>
    <div id="userEmail" style="font-size:12px; color:#6b7280;">Loading...</div>
  </div>

  <div style="padding:10px 16px; font-weight:bold; color:#16a34a;">📊 Reports</div>
  <div class="menu-item">Sales summary</div>
  <div class="menu-item">Sales by item</div>
  <div class="menu-item">Sales by category</div>
  <div class="menu-item">Sales by employee</div>
  <div class="menu-item">Sales by payment type</div>
  <div class="menu-item">Receipts</div>
  <div class="menu-item">Sales by modifier</div>
  <div class="menu-item">Discounts</div>
  <div class="menu-item">Taxes</div>
  <div class="menu-item">Shifts</div>

  <div style="padding:10px 16px; font-weight:bold;">🛍 Items</div>
  <div class="menu-item">Inventory management</div>

  <div style="padding:10px 16px; font-weight:bold;">👥 Employees</div>

</div>

<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>

<div class="header">
  <div class="hamburger" onclick="toggleDrawer()">☰</div>
  Sales summary
</div>

<div class="container">

  <div class="range-bar">
    <button onclick="move(-7)">◀</button>
    <div id="rangeText" onclick="openCalendar()" style="cursor:pointer;"></div>
    <button onclick="move(7)">▶</button>
  </div>

  <div class="cards">
    <div class="card"><div>Gross Sales</div><div id="gross">₱0</div></div>
    <div class="card"><div>Net Sales</div><div id="net">₱0</div></div>
    <div class="card"><div>Profit</div><div id="profit">₱0</div></div>
    <div class="card"><div>Refund</div><div id="refund">₱0</div></div>
  </div>

  <div class="panel">
    <canvas id="chart"></canvas>

    <div style="margin-top:20px;">
      <div style="font-weight:bold; margin-bottom:8px;">EXPORT</div>

      <div style="display:flex; justify-content:space-between; font-size:13px; color:#6b7280; padding:6px 0; border-bottom:1px solid #eee;">
        <div>Date</div>
        <div>Gross Sales</div>
      </div>

      <div id="tableRows"></div>
    </div>
  </div>

</div>

<!-- CALENDAR -->
<div class="calendar-modal" id="calendarModal">
  <div class="calendar-box">
    <div id="calendarTitle"></div>
    <div class="calendar-grid" id="calendarGrid"></div>

    <div style="margin-top:10px; display:flex; justify-content:flex-end; gap:10px;">
      <button onclick="closeCalendar()">Cancel</button>
      <button onclick="closeCalendar()">Done</button>
    </div>
  </div>
</div>

<script>

/* Drawer */
function toggleDrawer(){
  document.getElementById("drawer").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAKP...",
  authDomain: "sah-bacoor-pos.firebaseapp.com",
  projectId: "sah-bacoor-pos"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ✅ GET LOGGED-IN EMAIL */
firebase.auth().onAuthStateChanged(user=>{
  document.getElementById("userEmail").innerText =
    user ? user.email : "Not logged in";
});

/* UID */
function getUIDFromURL(){
  return new URLSearchParams(window.location.search).get("uid");
}
const uid = getUIDFromURL();

let allData = [];
let chart;

let startDate = new Date();
let endDate = new Date();
startDate.setDate(endDate.getDate()-6);

function format(d){
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}

function updateRange(){
  document.getElementById("rangeText").innerText =
    `${format(startDate)} → ${format(endDate)}`;
}

/* CALENDAR */
let selectingStart = true;

function openCalendar(){
  document.getElementById("calendarModal").style.display="flex";
  renderCalendar(new Date());
}

function closeCalendar(){
  document.getElementById("calendarModal").style.display="none";
}

function renderCalendar(date){
  let grid = document.getElementById("calendarGrid");
  grid.innerHTML="";

  document.getElementById("calendarTitle").innerText =
    date.toLocaleString("default",{month:"long",year:"numeric"});

  let year = date.getFullYear();
  let month = date.getMonth();

  let first = new Date(year,month,1).getDay();
  let days = new Date(year,month+1,0).getDate();

  for(let i=0;i<first;i++){
    grid.innerHTML += "<div></div>";
  }

  for(let d=1; d<=days; d++){
    let el = document.createElement("div");
    el.className="day";
    el.innerText=d;

    el.onclick=()=>{
      let picked = new Date(year,month,d);

      if(selectingStart){
        startDate = picked;
        selectingStart=false;
      }else{
        endDate = picked;
        selectingStart=true;
        closeCalendar();
        apply();
      }
    };

    grid.appendChild(el);
  }
}

/* HELPERS */
function formatKey(date) {
  const d = new Date(date);
  return d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,'0') + "-" +
    String(d.getDate()).padStart(2,'0');
}

function getDateRange(start, end) {
  let arr = [];
  let current = new Date(start);
  while (current <= end) {
    arr.push(new Date(current));
    current.setDate(current.getDate() + 1);
  }
  return arr;
}

/* DATA */
function apply(){
  updateRange();

  let s = new Date(startDate);
  let e = new Date(endDate);
  s.setHours(0,0,0,0);
  e.setHours(23,59,59,999);

  let filtered = allData.filter(d=>d.date>=s && d.date<=e);

  let gross=0, profit=0, refund=0;

  filtered.forEach(d=>{
    gross += d.total;
    profit += d.profit || 0;
    if(d.isRefund){
      refund += Math.abs(d.total || 0);
    }
  });

  document.getElementById("gross").innerText="₱"+gross.toFixed(2);
  document.getElementById("net").innerText="₱"+gross.toFixed(2);
  document.getElementById("profit").innerText="₱"+profit.toFixed(2);
  document.getElementById("refund").innerText="₱"+refund.toFixed(2);

  updateChart(filtered);
}

/* CHART */
function updateChart(data){

  let map = {};

  data.forEach(d=>{
    let key = formatKey(d.date);
    map[key] = (map[key] || 0) + d.total;
  });

  let s = new Date(startDate);
  let e = new Date(endDate);
  s.setHours(0,0,0,0);
  e.setHours(23,59,59,999);

  let fullDates = getDateRange(s, e);

  let labels = [];
  let values = [];
  let exportData = [];

  fullDates.forEach(d=>{
    let key = formatKey(d);
    let value = map[key] || 0;

    labels.push(d.toLocaleDateString("en-US",{month:"short",day:"numeric"}));
    values.push(value);

    exportData.push({
      date: key,
      sales: value
    });
  });

  renderTable(exportData);

  if(chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{
      labels: labels,
      datasets:[{
        label: "Gross Sales",
        data: values,
        backgroundColor:"#16a34a",
        barThickness:14,
        maxBarThickness:18
      }]
    }
  });
}

/* TABLE */
function renderTable(data){
  let container = document.getElementById("tableRows");
  container.innerHTML = "";

  let reversed = [...data].reverse();

  reversed.forEach(row => {
    let date = new Date(row.date);

    let formattedDate = date.toLocaleDateString("en-US", {
      month: "short",
      day: "numeric",
      year: "numeric"
    });

    let div = document.createElement("div");

    div.style.display = "flex";
    div.style.justifyContent = "space-between";
    div.style.padding = "10px 0";
    div.style.borderBottom = "1px solid #f1f1f1";

    div.innerHTML = `
      <div>${formattedDate}</div>
      <div>₱${row.sales.toLocaleString()}</div>
    `;

    container.appendChild(div);
  });
}

/* FIRESTORE */
if(!uid){
  alert("No UID in URL");
}else{
  db.collection("users")
    .doc(uid)
    .collection("sales")
    .onSnapshot(snap=>{
      allData=[];

      snap.forEach(doc=>{
        let d=doc.data();
        if(!d.createdAt) return;

        allData.push({
          total:Number(d.total||0),
          profit:Number(d.profit||0),
          isRefund:d.isRefund || false,
          date:d.createdAt.toDate()
        });
      });

      apply();
    });
}

/* MOVE */
function move(days){
  startDate.setDate(startDate.getDate()+days);
  endDate.setDate(endDate.getDate()+days);
  apply();
}

</script>

</body>
</html>
