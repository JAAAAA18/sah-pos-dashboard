<!DOCTYPE html>
<html>
<head>
  <title>SAH POS Dashboard</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f3f4f6;
    }

    .header {
      position: sticky;
      top: 0;
      background: #16a34a;
      color: white;
      padding: 14px 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hamburger { cursor: pointer; }

    .drawer {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: white;
      transition: 0.3s;
      z-index: 1000;
      overflow: auto;
    }

    .drawer.open { left: 0; }

    .overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.3);
      display: none;
    }

    .overlay.show { display: block; }

    .menu-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f1f1f1;
      font-size: 14px;
    }

    .container { padding: 18px; }

    .range-wrapper {
      background: #e5e5e5;
      padding: 14px 18px;
    }

    .range-box {
      display: inline-flex;
      align-items: center;
      background: white;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      overflow: hidden;
    }

    .range-btn {
      border: none;
      background: #f9fafb;
      padding: 14px 16px;
      cursor: pointer;
      font-size: 14px;
    }

    .range-date {
      padding: 0 18px;
      font-size: 15px;
      display: flex;
      align-items: center;
    }

    .cards { display: flex; gap: 12px; overflow-x: auto; }
    .card { min-width: 140px; background: white; padding: 14px; border-radius: 12px; }

    .panel { background: white; padding: 14px; border-radius: 12px; margin-top: 14px; }

    #categoryView { display: none; padding: 18px; }

    .date-cell { padding: 10px 0; cursor: pointer; border-radius: 8px; }

    .date-selected { background: #16a34a !important; color: white; }
    .date-end { background: #dc2626 !important; color: white; }
    .date-range { background: #bbf7d0 !important; }
  </style>
</head>

<body>

<div class="drawer" id="drawer"></div>
<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>

<div class="header" id="headerTitle">
  <div class="hamburger" onclick="toggleDrawer()">☰</div>
  Sales summary
</div>

<div class="container" id="mainContainer" style="display:none;">
  <div class="range-wrapper">
    <div class="range-box">
      <button class="range-btn" onclick="move(-7)">◀</button>
      <div class="range-date" onclick="openCalendar()">
        <span id="rangeText"></span>
      </div>
      <button class="range-btn" onclick="move(7)">▶</button>
    </div>
  </div>

  <div class="cards">
    <div class="card"><div>Gross Sales</div><div id="gross">₱0</div></div>
    <div class="card"><div>Net Sales</div><div id="net">₱0</div></div>
    <div class="card"><div>Profit</div><div id="profit">₱0</div></div>
    <div class="card"><div>Refund</div><div id="refund">₱0</div></div>
  </div>

  <div class="panel">
    <canvas id="chart"></canvas>
    <div id="tableRows"></div>
  </div>
</div>

<div id="categoryView"></div>

<script>
/* FIXED DRAWER */
function toggleDrawer() {
  drawer.classList.toggle("open");
  overlay.classList.toggle("show");
}

/* FIREBASE */
firebase.initializeApp({
  apiKey: "AIzaSyAKP2N3Jm5BQoK9QZyhV18cjVC8TKtrgBk",
  authDomain: "sah-bacoor-pos.firebaseapp.com",
  projectId: "sah-bacoor-pos"
});

const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

function login(){
  firebase.auth().signInWithPopup(provider).then(res=>{
    location.href="?uid="+res.user.uid;
  });
}

firebase.auth().onAuthStateChanged(user=>{
  userEmail.innerText = user ? user.email : "Not logged in";
});

/* SAFE VARIABLES */
const uid = new URLSearchParams(location.search).get("uid");
let allData=[], chart;

let startDate=new Date(), endDate=new Date();
startDate.setDate(endDate.getDate()-6);

/* SAFE RANGE TEXT */
function updateRange(){
  if(rangeText)
    rangeText.innerText =
      `${startDate.toLocaleDateString()} → ${endDate.toLocaleDateString()}`;
}

/* FIXED APPLY */
function apply(){
  updateRange();

  let filtered = allData.filter(d=>d.date>=startDate && d.date<=endDate);

  let gross=0, profit=0, refund=0;

  filtered.forEach(d=>{
    if(d.isRefund){
      gross+=d.total;
      profit+=d.profit;
      refund+=Math.abs(d.total);
    }else{
      gross+=d.total;
      profit+=d.profit;
    }
  });

  grossEl.innerText="₱"+gross.toFixed(2);
  net.innerText="₱"+gross.toFixed(2);
  profitEl.innerText="₱"+profit.toFixed(2);
  refundEl.innerText="₱"+refund.toFixed(2);

  updateChart(filtered);
}

/* FIXED CHART */
function updateChart(data){

  let labels=[], sales1=[], sales2=[];

  data.forEach(d=>{
    labels.push(d.date.toDateString());
    sales1.push(d.total||0);
    sales2.push(0);
  });

  if(chart && chart.destroy) chart.destroy();

  chart=new Chart(chartCanvas,{
    type:"bar",
    data:{
      labels,
      datasets:[
        {label:"Sales 1",data:sales1,backgroundColor:"#16a34a"},
        {label:"Sales 2",data:sales2,backgroundColor:"#dc2626"}
      ]
    }
  });
}

/* FIXED FIRESTORE */
if(uid){
  mainContainer.style.display="block";

  db.collection("users").doc(uid).collection("sales")
  .onSnapshot(snap=>{
    allData=[];

    snap.forEach(doc=>{
      let d=doc.data();
      if(!d.createdAt || typeof d.createdAt.toDate!=="function") return;

      allData.push({
        date:d.createdAt.toDate(),
        total:Number(d.total||0),
        profit:Number(d.profit||0),
        isRefund:d.isRefund||false
      });
    });

    apply();
  });
}

/* SINGLE CLEAN CALENDAR ONLY */
function openCalendar(){
  calendarModal.style.display="flex";
  selectedStart=startDate;
  selectedEnd=endDate;
  renderCalendar();
}

function closeCalendar(){
  calendarModal.style.display="none";
}

function applyCalendar(){
  startDate=selectedStart;
  endDate=selectedEnd;
  apply();
  closeCalendar();
}

/* FIXED MOVE */
function move(days){
  startDate.setDate(startDate.getDate()+days);
  endDate.setDate(endDate.getDate()+days);
  apply();
}

/* ELEMENTS */
const grossEl=document.getElementById("gross");
const profitEl=document.getElementById("profit");
const refundEl=document.getElementById("refund");
const chartCanvas=document.getElementById("chart");
const net=document.getElementById("net");
const rangeText=document.getElementById("rangeText");
const tableRows=document.getElementById("tableRows");
const drawer=document.getElementById("drawer");
const overlay=document.getElementById("overlay");
const mainContainer=document.getElementById("mainContainer");

</script>

<!-- ONLY ONE CALENDAR (FIXED) -->
<div id="calendarModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:5000;">
  <div style="background:white;margin:10% auto;padding:20px;width:90%;max-width:400px;">
    <div id="calendarGrid"></div>

    <button onclick="closeCalendar()">Cancel</button>
    <button onclick="applyCalendar()">Done</button>
  </div>
</div>

</body>
</html>
