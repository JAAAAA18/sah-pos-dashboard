<!DOCTYPE html>
<html>
<head>
  <title>SAH POS Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    body { margin:0; font-family:Arial; background:#f3f4f6; }
    .header { position:sticky; top:0; background:#111827; color:white; padding:14px 18px; font-weight:bold; }
    .container { padding:18px; }
    .range-bar { display:flex; justify-content:center; gap:12px; background:white; padding:12px; border-radius:10px; margin-bottom:14px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; }
    .card { background:white; padding:14px; border-radius:12px; }
    .label { font-size:12px; color:#6b7280; }
    .value { font-size:20px; font-weight:bold; }
    .panel { background:white; padding:14px; border-radius:12px; }

    @media (max-width:768px){
      .cards{grid-template-columns:repeat(2,1fr);}
      .value{font-size:16px;}
    }

    .auth-bar {
      padding:10px;
      background:#fff;
      display:flex;
      gap:10px;
      justify-content:center;
    }

    button {
      padding:6px 12px;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="header">SAH POS • Analytics</div>

<!-- 🔐 LOGIN / LOGOUT -->
<div class="auth-bar">
  <button onclick="login()">Login</button>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

  <div class="range-bar">
    <button onclick="move(-7)">◀</button>
    <div id="rangeText"></div>
    <button onclick="move(7)">▶</button>
  </div>

  <div class="cards">
    <div class="card"><div class="label">Gross Sales</div><div class="value" id="gross">₱0</div></div>
    <div class="card"><div class="label">Net Sales</div><div class="value" id="net">₱0</div></div>
    <div class="card"><div class="label">Profit</div><div class="value" id="profit">₱0</div></div>
    <div class="card"><div class="label">Cash</div><div class="value" id="cash">₱0</div></div>
    <div class="card"><div class="label">GCash</div><div class="value" id="gcash">₱0</div></div>
  </div>

  <div class="panel">
    <canvas id="chart"></canvas>
    <div style="margin-top:20px;">
      <div style="font-weight:bold;">EXPORT</div>
      <div id="tableRows"></div>
    </div>
  </div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAP2N3Jm5BQoK9QZyhV18cjVC8TKtrgBk",
  authDomain: "sah-bacoor-pos.firebaseapp.com",
  projectId: "sah-bacoor-pos",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let chart;
let allData = [];
let unsubscribeSales = null;

let startDate = new Date();
let endDate = new Date();
startDate.setDate(endDate.getDate() - 6);

function format(date){
  return date.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}

function updateRange(){
  document.getElementById("rangeText").innerText =
  `${format(startDate)} → ${format(endDate)}`;
}

window.move = function(days){
  startDate.setDate(startDate.getDate()+days);
  endDate.setDate(endDate.getDate()+days);
  apply();
};

function getDateRange(start, end) {
  let arr = [];
  let current = new Date(start);
  while (current <= end) {
    arr.push(new Date(current));
    current.setDate(current.getDate() + 1);
  }
  return arr;
}

function apply(){
  let s=new Date(startDate);
  let e=new Date(endDate);
  s.setHours(0,0,0,0);
  e.setHours(23,59,59,999);
  let filtered=allData.filter(d=>d.date>=s&&d.date<=e);
  updateRange();
  render(filtered, s, e);
}

function render(data, start, end){
  let gross=0,profit=0,cash=0,gcash=0;
  let map={};

  data.forEach(d=>{
    gross+=d.total;
    profit+=d.profit;
    cash+=d.cash;
    gcash+=d.gcash;

    let key = new Date(d.date);
    key.setHours(0,0,0,0);
    key = key.toISOString().split("T")[0];

    map[key] = (map[key] || 0) + d.total;
  });

  document.getElementById("gross").innerText="₱"+gross;
  document.getElementById("net").innerText="₱"+(gross*0.4);
  document.getElementById("profit").innerText="₱"+profit;
  document.getElementById("cash").innerText="₱"+cash;
  document.getElementById("gcash").innerText="₱"+gcash;

  let fullDates = getDateRange(start, end);
  let labels = [];
  let values = [];

  fullDates.forEach(d=>{
    let key = new Date(d);
    key.setHours(0,0,0,0);
    key = key.toISOString().split("T")[0];

    labels.push(format(d));
    values.push(map[key] || 0);
  });

  updateChart(labels, values);
}

function updateChart(labels, values) {
  if (chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: "#16a34a"
      }]
    }
  });
}

/* 🔐 LOGIN FUNCTIONS */
function login(){
  const email = prompt("Enter email:");
  const password = prompt("Enter password:");

  auth.signInWithEmailAndPassword(email, password)
    .then(user => {
      console.log("Logged in:", user.user.uid);
    })
    .catch(err => alert(err.message));
}

function logout(){
  auth.signOut();
  console.log("Logged out");
}

/* ✅ PER USER DATA */
auth.onAuthStateChanged(user => {

  console.log("CURRENT UID:", user ? user.uid : "NONE");

  if (unsubscribeSales) {
    unsubscribeSales();
    unsubscribeSales = null;
  }

  allData = [];

  if (!user) {
    apply();
    return;
  }

  unsubscribeSales = db
    .collection("users")
    .doc(user.uid)
    .collection("sales")
    .onSnapshot(snapshot => {

      allData = [];

      snapshot.forEach(doc => {
        const d = doc.data();
        if (!d.createdAt) return;

        allData.push({
          total: Number(d.total || 0),
          profit: Number(d.profit || 0),
          cash: Number(d.cash || 0),
          gcash: Number(d.gcash || 0),
          date: d.createdAt.toDate()
        });
      });

      apply();
    });

});

</script>

</body>
</html>
