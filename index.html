<!DOCTYPE html>
<html>
<head>
  <title>SAH POS Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    body { margin:0; font-family:Arial; background:#f3f4f6; overflow-x:hidden; }

    .header {
      position:sticky;
      top:0;
      background:#111827;
      color:white;
      padding:14px 18px;
      font-weight:bold;
      display:flex;
      align-items:center;
      gap:10px;
    }

    /* ✅ HAMBURGER */
    .menu-btn {
      font-size:20px;
      cursor:pointer;
    }

    /* ✅ DRAWER */
    .drawer {
      position:fixed;
      top:0;
      left:-260px;
      width:260px;
      height:100%;
      background:#111827;
      color:white;
      transition:0.3s;
      z-index:1000;
      padding-top:20px;
    }

    .drawer.open {
      left:0;
    }

    .drawer div {
      padding:14px 20px;
      border-bottom:1px solid rgba(255,255,255,0.1);
      cursor:pointer;
    }

    .drawer div:hover {
      background:#1f2937;
    }

    /* ✅ OVERLAY */
    .overlay {
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.4);
      display:none;
      z-index:999;
    }

    .overlay.show {
      display:block;
    }

    .container { padding:18px; }
    .range-bar { display:flex; justify-content:center; gap:12px; background:white; padding:12px; border-radius:10px; margin-bottom:14px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; }
    .card { background:white; padding:14px; border-radius:12px; }
    .label { font-size:12px; color:#6b7280; }
    .value { font-size:20px; font-weight:bold; }
    .panel { background:white; padding:14px; border-radius:12px; }

    @media (max-width:768px){
      .cards{grid-template-columns:repeat(2,1fr);}
      .value{font-size:16px;}
    }
  </style>
</head>

<body>

<!-- ✅ DRAWER -->
<div id="drawer" class="drawer">
  <div onclick="closeDrawer()">Dashboard</div>
  <div onclick="closeDrawer()">Sales</div>
  <div onclick="closeDrawer()">Receipts</div>
  <div onclick="closeDrawer()">Shift</div>
  <div onclick="closeDrawer()">BackOffice</div>
  <div onclick="closeDrawer()">Printers</div>
  <div onclick="closeDrawer()">Settings</div>
</div>

<!-- ✅ OVERLAY -->
<div id="overlay" class="overlay" onclick="closeDrawer()"></div>

<!-- ✅ HEADER WITH HAMBURGER -->
<div class="header">
  <span class="menu-btn" onclick="openDrawer()">☰</span>
  SAH POS • Analytics
</div>

<div class="container">

  <div class="range-bar">
    <button onclick="move(-7)">◀</button>
    <div id="rangeText"></div>
    <button onclick="move(7)">▶</button>
  </div>

  <div class="cards">
    <div class="card"><div class="label">Gross Sales</div><div class="value" id="gross">₱0</div></div>
    <div class="card"><div class="label">Net Sales</div><div class="value" id="net">₱0</div></div>
    <div class="card"><div class="label">Profit</div><div class="value" id="profit">₱0</div></div>
    <div class="card"><div class="label">Refund</div><div class="value" id="refund">₱0</div></div>
    <div class="card"><div class="label">Cash Balance</div><div class="value" id="cash">₱0</div></div>
  </div>

  <div class="panel">
    <canvas id="chart"></canvas>

    <div style="margin-top:20px;">
      <div style="font-weight:bold; margin-bottom:8px;">EXPORT</div>

      <div style="display:flex; justify-content:space-between; font-size:13px; color:#6b7280; padding:6px 0; border-bottom:1px solid #eee;">
        <div>Date</div>
        <div>Gross Sales</div>
      </div>

      <div id="tableRows"></div>
    </div>

  </div>

</div>

<script>

/* ✅ DRAWER FUNCTIONS */
function openDrawer(){
  document.getElementById("drawer").classList.add("open");
  document.getElementById("overlay").classList.add("show");
}

function closeDrawer(){
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

</body>
</html>
